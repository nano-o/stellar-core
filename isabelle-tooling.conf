# Project descriptor for the Isabelle formal-modeling tooling ($ISABELLE_TOOLING_ROOT).
# Data only: key=value, one per line, never sourced. See the tooling README.
format_version=1
source_rel=.
formal_rel=formal
build_session=OfferExchange
session_dir=OfferExchange
# ic2 starts from the session requirement, not the OfferExchange heap itself.
# If the project session is the logic, its theories are heap nodes and ic2
# cannot expose their per-command diagnostics or sorry positions after edits.
ic2_base_session=HOL
ic2_max_heap=12G
isabelle_version=Isabelle2025-2
# Differential testing: the exported code-level model, the project's dispatch
# ML for the generic model runner, and the named_theorems the export check
# audits alongside the code equations.
export_name=OfferExchange.Offer_Exchange_Test_Interface:code/offer_exchange_model.ML
model_dispatch=differential/model_dispatch.ML
audit_collection=export_audit
# Commit of the isabelle-formal-modeling-tooling clone these artifacts were validated against.
tooling_revision=015f774efea03f13780fc8bd96e03d97fbbd716a
